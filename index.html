<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">
        <h1>Budget Calculator</h1>
        <form id="budgetForm">
            <div class="form-group">
                <label for="startAmount">Starting Amount (DH):</label>
                <input type="number" id="startAmount" value="1" min="1" required />
            </div>
            <div class="form-group">
                <label for="days">Number of Days:</label>
                <input type="number" id="days" value="10" min="1" required />
            </div>
            <div class="buttons">
                <button type="button" id="calculate">Calculate Total</button>
                <button type="button" id="reset">Reset</button>
            </div>
        </form>

        <div id="result"></div>
    </div>


    <script src="main.js"></script>
</body>

</html>
